name: 용어 추가 제보
description: 사전에 추가되었으면 하는 AI 용어를 제보합니다.
title: "[용어] "
labels: ["new-term"]
body:
  - type: input
    id: term-ko
    attributes:
      label: 한글 용어명
      description: 추가하고 싶은 용어의 한글 이름
      placeholder: 예) 파인튜닝
    validations:
      required: true
  - type: input
    id: term-en
    attributes:
      label: 영문명
      description: 알고 있다면 영문 표기를 적어주세요
      placeholder: 예) Fine-tuning
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: 카테고리
      description: 이 용어가 속한다고 생각하는 분류
      options:
        - 데이터
        - 학습파이프라인
        - 저장검색
        - 모델
        - 실행
        - 구조
        - 지식그래프
        - 문제평가
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: 난이도
      options:
        - 기초
        - 중급
        - 심화
    validations:
      required: false
  - type: textarea
    id: one-liner
    attributes:
      label: 한줄 설명
      description: 이 용어를 한 문장으로 설명해주세요
      placeholder: 예) 이미 학습된 모델을 특정 목적에 맞게 추가로 학습시키는 것
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 이 용어를 어디서 봤는지 / 왜 필요한지
      description: 용어를 접한 상황이나 추가가 필요하다고 느낀 이유를 적어주세요
    validations:
      required: false
