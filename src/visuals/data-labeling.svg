<svg viewBox="0 0 330 130" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="inherit" role="img" aria-label="정답이 없는 데이터에 사람이 긍정·부정 같은 정답표를 달아 학습용 데이터로 만드는 그림">
  <defs>
    <marker id="lb-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="var(--viz-muted)" stroke-width="1"/>
    </marker>
  </defs>

  <!-- 라벨 없는 데이터 -->
  <g font-size="12" text-anchor="middle">
    <rect x="16" y="20" width="52" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="1"/><text x="42" y="37" fill="var(--viz-muted)">?</text>
    <rect x="16" y="52" width="52" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="1"/><text x="42" y="69" fill="var(--viz-muted)">?</text>
    <rect x="16" y="84" width="52" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="1"/><text x="42" y="101" fill="var(--viz-muted)">?</text>
  </g>
  <text x="42" y="122" text-anchor="middle" font-size="9" fill="var(--viz-muted)">정답 없음</text>

  <!-- 사람이 정답 달기 -->
  <line x1="76" y1="64" x2="140" y2="64" stroke="var(--viz-muted)" stroke-width="1" marker-end="url(#lb-arrow)"/>
  <text x="108" y="56" text-anchor="middle" font-size="9" fill="currentColor">사람이 정답 달기</text>

  <!-- 라벨 붙은 데이터 -->
  <g font-size="10" text-anchor="middle">
    <rect x="150" y="20" width="64" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="1"/><text x="182" y="36" fill="currentColor">리뷰</text>
    <rect x="222" y="20" width="52" height="24" rx="12" fill="var(--viz-accent)"/><text x="248" y="36" fill="currentColor">긍정</text>
    <rect x="150" y="52" width="64" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="1"/><text x="182" y="68" fill="currentColor">리뷰</text>
    <rect x="222" y="52" width="52" height="24" rx="12" fill="var(--viz-accent-2)"/><text x="248" y="68" fill="currentColor">부정</text>
    <rect x="150" y="84" width="64" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="1"/><text x="182" y="100" fill="currentColor">리뷰</text>
    <rect x="222" y="84" width="52" height="24" rx="12" fill="var(--viz-accent)"/><text x="248" y="100" fill="currentColor">긍정</text>
  </g>
  <text x="212" y="122" text-anchor="middle" font-size="9" fill="var(--viz-muted)">정답이 달린 학습 데이터</text>
</svg>
