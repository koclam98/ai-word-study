<svg viewBox="0 0 320 210" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="inherit" role="img" aria-label="2차원 평면에 단어가 점으로 배치되고, 과일 무리와 탈것 무리로 나뉘며 '배'가 양쪽에 하나씩 놓인 그림">
  <!-- 축 -->
  <line x1="30" y1="185" x2="300" y2="185" stroke="var(--viz-muted)" stroke-width="1"/>
  <line x1="30" y1="185" x2="30" y2="20" stroke="var(--viz-muted)" stroke-width="1"/>

  <!-- 과일 무리 -->
  <ellipse cx="95" cy="80" rx="52" ry="42" fill="none" stroke="var(--viz-accent)" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="var(--viz-accent)">
    <circle cx="78" cy="62" r="3"/><circle cx="112" cy="70" r="3"/><circle cx="92" cy="100" r="3"/>
  </g>
  <g fill="currentColor" font-size="10">
    <text x="84" y="59">사과</text>
    <text x="118" y="72">포도</text>
    <text x="98" y="103">배</text>
  </g>

  <!-- 탈것 무리 -->
  <ellipse cx="230" cy="140" rx="56" ry="40" fill="none" stroke="var(--viz-accent-2)" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="var(--viz-accent-2)">
    <circle cx="208" cy="128" r="3"/><circle cx="252" cy="132" r="3"/><circle cx="230" cy="160" r="3"/>
  </g>
  <g fill="currentColor" font-size="10">
    <text x="176" y="126">자동차</text>
    <text x="256" y="130">비행기</text>
    <text x="236" y="163">배</text>
  </g>
</svg>
