<svg viewBox="0 0 340 170" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="inherit" role="img" aria-label="왼쪽 파인튜닝은 지식을 머리에 넣는 방식, 오른쪽 RAG는 책을 보고 답하는 방식으로 비교한 그림">
  <defs>
    <marker id="ft-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="var(--viz-accent)" stroke-width="1"/>
    </marker>
    <marker id="rag-arrow2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="var(--viz-accent-2)" stroke-width="1"/>
    </marker>
  </defs>

  <!-- 가운데 구분선 -->
  <line x1="170" y1="14" x2="170" y2="156" stroke="var(--viz-muted)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 왼쪽: 파인튜닝 = 머리에 넣기 -->
  <text x="85" y="26" text-anchor="middle" font-size="11" fill="currentColor">파인튜닝</text>
  <g fill="var(--viz-accent)">
    <rect x="26" y="70" width="9" height="9" rx="1"/>
    <rect x="26" y="86" width="9" height="9" rx="1"/>
    <rect x="26" y="102" width="9" height="9" rx="1"/>
  </g>
  <line x1="40" y1="90" x2="66" y2="90" stroke="var(--viz-accent)" stroke-width="1" marker-end="url(#ft-arrow)"/>
  <!-- 머리 -->
  <circle cx="105" cy="92" r="30" fill="none" stroke="currentColor" stroke-width="1"/>
  <path d="M92 92 q13 -14 26 0" fill="none" stroke="var(--viz-accent)" stroke-width="1"/>
  <text x="105" y="140" text-anchor="middle" font-size="9" fill="var(--viz-muted)">지식을 머리에 넣음</text>

  <!-- 오른쪽: RAG = 책 보고 답하기 -->
  <text x="255" y="26" text-anchor="middle" font-size="11" fill="currentColor">RAG</text>
  <!-- 사람 -->
  <circle cx="212" cy="78" r="12" fill="none" stroke="currentColor" stroke-width="1"/>
  <path d="M200 112 q12 -20 24 0" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="224" y1="92" x2="250" y2="92" stroke="var(--viz-accent-2)" stroke-width="1" marker-end="url(#rag-arrow2)"/>
  <!-- 책 -->
  <rect x="258" y="70" width="46" height="40" rx="2" fill="none" stroke="var(--viz-accent-2)" stroke-width="1"/>
  <line x1="281" y1="72" x2="281" y2="108" stroke="var(--viz-accent-2)" stroke-width="1"/>
  <text x="255" y="140" text-anchor="middle" font-size="9" fill="var(--viz-muted)">책을 보고 답함</text>
</svg>
